<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540"><rect width="1000" height="540" rx="24" fill="#f4f7fb"/><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><text x="500" y="65" font-size="29" font-weight="700" fill="#172c45">从问卷资料到分析报告</text><rect x="70" y="110" width="390" height="155" rx="18" fill="white" stroke="#cfdaea"/><text x="115" y="152" font-size="22" fill="#3477b8">01</text><text x="265" y="190" font-size="27" font-weight="700" fill="#172c45">原始问卷</text><text x="265" y="228" font-size="18" fill="#526779">准备问卷数据，保留原文件</text><rect x="540" y="110" width="390" height="155" rx="18" fill="white" stroke="#cfdaea"/><text x="585" y="152" font-size="22" fill="#3477b8">02</text><text x="735" y="190" font-size="27" font-weight="700" fill="#172c45">检查与清理</text><text x="735" y="228" font-size="18" fill="#526779">检查重复、缺失与异常记录</text><rect x="70" y="320" width="390" height="155" rx="18" fill="white" stroke="#cfdaea"/><text x="115" y="362" font-size="22" fill="#3477b8">03</text><text x="265" y="400" font-size="27" font-weight="700" fill="#172c45">统计与绘图</text><text x="265" y="438" font-size="18" fill="#526779">核对口径，生成统计图表</text><rect x="540" y="320" width="390" height="155" rx="18" fill="white" stroke="#cfdaea"/><text x="585" y="362" font-size="22" fill="#3477b8">04</text><text x="735" y="400" font-size="27" font-weight="700" fill="#172c45">生成报告</text><text x="735" y="438" font-size="18" fill="#526779">整理结论，检查事实与来源</text><text x="500" y="198" font-size="32" fill="#3477b8">→</text><text x="500" y="408" font-size="32" fill="#3477b8">→</text></g><path d="M 735 278 L 735 292 L 265 292 L 265 307" stroke="#3477b8" stroke-width="3" fill="none"/><path d="m258 299 7 9 7-9" fill="none" stroke="#3477b8" stroke-width="3"/></svg>